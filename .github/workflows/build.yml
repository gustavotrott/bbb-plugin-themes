name: Build

# Pushes to main publish dist/ on GitHub Pages: the plugin with every theme,
# so a meeting can load it straight from https://<owner>.github.io/<repo>/manifest.json,
# and each theme as a stylesheet, https://<owner>.github.io/<repo>/<theme>/theme.css.
# Tags (v*) attach the ready-to-install tarball bbb-plugin-themes.tar.gz to a
# GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for file in package.json manifest.json; do
            version=$(node -p "require('./$file').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$file::version $version does not match the tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run build-bundle
      # Until bigbluebutton/bigbluebutton#26415 ships, the stylesheet for 4.0.3
      # (which has its classes) lives on the bbb-classes-26415 branch
      - name: Stylesheet for BigBlueButton 4.0.3
        run: |
          if git fetch --depth=1 origin bbb-classes-26415; then
            git worktree add /tmp/bbb-4.0.3 FETCH_HEAD
            node scripts/css.js --root /tmp/bbb-4.0.3 --version 4.0.3
          fi
      # One tarball with one folder, bbb-plugin-themes/, holding the contents of
      # dist/: the plugin (BbbPluginThemes.js, manifest.json) and every theme's
      # stylesheets in <theme>/. Extracted into the plugins folder, it creates or
      # updates plugins/bbb-plugin-themes/. Only that folder is listed, so there
      # is no "." entry and extracting never touches the plugins folder itself.
      - name: Package
        run: |
          mkdir -p release package
          cp -R dist package/bbb-plugin-themes
          (cd package && tar czf ../release/bbb-plugin-themes.tar.gz --owner=0 --group=0 bbb-plugin-themes)
          tar tzvf release/bbb-plugin-themes.tar.gz
      - name: Site
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: node scripts/site.js
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          path: site
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/bbb-plugin-themes.tar.gz --title "${{ github.ref_name }}" --generate-notes

  pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
