name: Build

# Pushes to main publish every theme on GitHub Pages, so a meeting can load
# one straight from https://<owner>.github.io/<repo>/<theme>/manifest.json.
# Tags (v*) attach ready-to-install tarballs to a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build-bundle
      - name: Package
        run: |
          mkdir -p release all
          for dir in dist/*/; do
            theme=$(basename "$dir")
            tar czf "release/bbb-plugin-$theme-theme.tar.gz" --owner=0 --group=0 -C "$dir" .
            cp -R "$dir" "all/bbb-plugin-$theme-theme"
          done
          # Folders only, no "." entry, so extracting never touches the plugins folder itself
          (cd all && tar czf ../release/bbb-plugin-themes.tar.gz --owner=0 --group=0 bbb-plugin-*-theme)
          ls -l release
      - name: Site
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: node scripts/site.js
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          path: site
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/*.tar.gz --title "${{ github.ref_name }}" --generate-notes

  pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
